server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}
spring.application.name=z-wf
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ========== Spring DataSource (Camunda BPM 用) ==========
# 生产环境请通过 SPRING_DATASOURCE_* 环境变量注入, 切勿提交真实凭证
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeMe}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/z_wf?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.initialSize=5
spring.datasource.minIdle=5
spring.datasource.maxActive=20
spring.datasource.maxWait=60000
spring.datasource.filters=stat,wall

# ========== Camunda BPM 配置 ==========
camunda.bpm.admin-user.id=${CAMUNDA_ADMIN_USER:admin}
camunda.bpm.admin-user.password=${CAMUNDA_ADMIN_PASSWORD:admin}
camunda.bpm.admin-user.firstName=Admin
# 自动部署 classpath:processes/*.bpmn
camunda.bpm.deployment-resource-pattern=classpath*:processes/*.bpmn
# 启动时自动建表 (生产环境建议关掉, 用 migrate 脚本)
camunda.bpm.database.schema-update=${CAMUNDA_SCHEMA_UPDATE:true}
camunda.bpm.database.type=mysql

# ========== z-config 注册中心 (服务注册) ==========
z.config.enabled=${Z_CONFIG_ENABLED:true}
z.config.server-addr=${Z_CONFIG_SERVER_ADDR:127.0.0.1:8848}
z.config.namespace=${Z_CONFIG_NAMESPACE:default}
z.config.connect-timeout-ms=5000
z.config.long-poll-timeout-ms=30000

# ========== z-rpc 服务端 (RPC 接口暴露) ==========
z.rpc.enabled=${Z_RPC_ENABLED:true}
z.rpc.server.host=0.0.0.0
z.rpc.server.port=${Z_RPC_SERVER_PORT:20880}
z.rpc.registry.type=z-config
z.rpc.registry.address=${Z_RPC_REGISTRY_ADDRESS:127.0.0.1:8848}
z.rpc.service=${Z_RPC_SERVICE:z-wf}

# ========== 日志 ==========
logging.level.root=INFO
logging.level.org.camunda=INFO
