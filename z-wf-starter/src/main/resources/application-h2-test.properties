# z-wf 端到端测试用 application — H2 内存数据库 + 关闭外部依赖
# 用法：java -jar z-wf-starter.jar --spring.profiles.active=h2-test

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}
spring.application.name=z-wf
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# H2 内存数据库（避免依赖 MySQL）
spring.datasource.url=jdbc:h2:mem:z_wf_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# ========== Camunda BPM 配置 ==========
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.firstName=Admin
camunda.bpm.deployment-resource-pattern=classpath*:processes/*.bpmn
camunda.bpm.database.schema-update=true
camunda.bpm.database.type=h2

# 关闭外部依赖以便本地测试
z.config.enabled=false
z.rpc.enabled=false

# ========== 日志 ==========
logging.level.root=INFO
logging.level.com.zifang.z.wf=DEBUG
logging.level.org.camunda=INFO
logging.level.org.hibernate=WARN
